<rect x="60" y="172" width="1160" height="242" rx="17" fill="#100D0F" stroke="#704E52" stroke-width="1.5"/><text x="78" y="198" text-anchor="start" font-size="13" font-weight="650" font-family="'SFMono-Regular',Consolas,monospace" fill="#E0A09B">01 / EVIDENCE → STRUCTURED KNOWLEDGE</text><rect x="80" y="218" width="168" height="143" rx="13" fill="#171416" stroke="#4B3C3D" stroke-width="1.3"/><text x="99" y="244" text-anchor="start" font-size="12" font-weight="600" font-family="'SFMono-Regular',Consolas,monospace" fill="#D68C87">01</text><text x="99" y="272" text-anchor="start" font-size="21" font-weight="550" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#F2ECE8">Message</text><text x="99" y="297" text-anchor="start" font-size="14" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#C3B5B1">Canonical</text><text x="99" y="317" text-anchor="start" font-size="14" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#C3B5B1">owner words</text><path d="M250 287 L272 287" fill="none" stroke="#AC7778" stroke-width="1.6"  marker-end="url(#arr)"/><rect x="278" y="218" width="168" height="143" rx="13" fill="#171416" stroke="#4B3C3D" stroke-width="1.3"/><text x="297" y="244" text-anchor="start" font-size="12" font-weight="600" font-family="'SFMono-Regular',Consolas,monospace" fill="#D68C87">02</text><text x="297" y="272" text-anchor="start" font-size="21" font-weight="550" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#F2ECE8">History</text><text x="297" y="297" text-anchor="start" font-size="14" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#C3B5B1">Immutable</text><text x="297" y="317" text-anchor="start" font-size="14" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#C3B5B1">evidence</text><path d="M448 287 L470 287" fill="none" stroke="#AC7778" stroke-width="1.6"  marker-end="url(#arr)"/><rect x="476" y="218" width="168" height="143" rx="13" fill="#171416" stroke="#4B3C3D" stroke-width="1.3"/><text x="495" y="244" text-anchor="start" font-size="12" font-weight="600" font-family="'SFMono-Regular',Consolas,monospace" fill="#D68C87">03</text><text x="495" y="272" text-anchor="start" font-size="21" font-weight="550" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#F2ECE8">Extraction</text><text x="495" y="297" text-anchor="start" font-size="14" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#C3B5B1">Model proposes;</text><text x="495" y="317" text-anchor="start" font-size="14" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#C3B5B1">server validates</text><path d="M646 287 L668 287" fill="none" stroke="#AC7778" stroke-width="1.6"  marker-end="url(#arr)"/><rect x="674" y="218" width="168" height="143" rx="13" fill="#171416" stroke="#4B3C3D" stroke-width="1.3"/><text x="693" y="244" text-anchor="start" font-size="12" font-weight="600" font-family="'SFMono-Regular',Consolas,monospace" fill="#D68C87">04</text><text x="693" y="272" text-anchor="start" font-size="21" font-weight="550" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#F2ECE8">Memory</text><text x="693" y="297" text-anchor="start" font-size="14" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#C3B5B1">Evidence links</text><text x="693" y="317" text-anchor="start" font-size="14" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#C3B5B1">append-only</text><path d="M844 287 L854 287" fill="none" stroke="#AC7778" stroke-width="1.6"  marker-end="url(#arr)"/><rect x="860" y="218" width="168" height="143" rx="13" fill="#171416" stroke="#4B3C3D" stroke-width="1.3"/><text x="879" y="244" text-anchor="start" font-size="12" font-weight="600" font-family="'SFMono-Regular',Consolas,monospace" fill="#D68C87">05</text><text x="879" y="272" text-anchor="start" font-size="21" font-weight="550" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#F2ECE8">Entities</text><text x="879" y="297" text-anchor="start" font-size="14" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#C3B5B1">Identities +</text><text x="879" y="317" text-anchor="start" font-size="14" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#C3B5B1">relationships</text><path d="M1030 287 L1042 287" fill="none" stroke="#AC7778" stroke-width="1.6"  marker-end="url(#arr)"/><rect x="1048" y="218" width="168" height="143" rx="13" fill="#171416" stroke="#4B3C3D" stroke-width="1.3"/><text x="1067" y="244" text-anchor="start" font-size="12" font-weight="600" font-family="'SFMono-Regular',Consolas,monospace" fill="#D68C87">06</text><text x="1067" y="272" text-anchor="start" font-size="21" font-weight="550" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#F2ECE8">Vectors</text><text x="1067" y="297" text-anchor="start" font-size="14" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#C3B5B1">Rebuildable</text><text x="1067" y="317" text-anchor="start" font-size="14" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#C3B5B1">pgvector index</text><text x="82" y="390" text-anchor="start" font-size="14" font-weight="500" font-family="'SFMono-Regular',Consolas,monospace" fill="#DFBEB6">A model's proposal is not yet durable knowledge. Every accepted memory cites evidence.</text><rect x="60" y="446" width="1160" height="293" rx="17" fill="#100D0F" stroke="#704E52" stroke-width="1.5"/><text x="78" y="472" text-anchor="start" font-size="13" font-weight="650" font-family="'SFMono-Regular',Consolas,monospace" fill="#E0A09B">02 / READS OF THE KNOWLEDGE LAYER</text><rect x="80" y="499" width="341" height="145" rx="13" fill="#171416" stroke="#4B3C3D" stroke-width="1.3"/><text x="99" y="525" text-anchor="start" font-size="12" font-weight="600" font-family="'SFMono-Regular',Consolas,monospace" fill="#D68C87">SEARCH</text><text x="99" y="553" text-anchor="start" font-size="21" font-weight="550" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#F2ECE8">Semantic retrieval</text><text x="99" y="578" text-anchor="start" font-size="14" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#C3B5B1">Owner-scoped nearest-neighbor search</text><text x="99" y="598" text-anchor="start" font-size="14" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#C3B5B1">One-hop entity context</text><rect x="469" y="499" width="341" height="145" rx="13" fill="#171416" stroke="#4B3C3D" stroke-width="1.3"/><text x="488" y="525" text-anchor="start" font-size="12" font-weight="600" font-family="'SFMono-Regular',Consolas,monospace" fill="#D68C87">PROJECTION</text><text x="488" y="553" text-anchor="start" font-size="21" font-weight="550" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#F2ECE8">Temporal resolution</text><text x="488" y="578" text-anchor="start" font-size="14" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#C3B5B1">Current · historical · uncertain</text><text x="488" y="598" text-anchor="start" font-size="14" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#C3B5B1">New facts do not erase old history</text><rect x="858" y="499" width="341" height="145" rx="13" fill="#171416" stroke="#4B3C3D" stroke-width="1.3"/><text x="877" y="525" text-anchor="start" font-size="12" font-weight="600" font-family="'SFMono-Regular',Consolas,monospace" fill="#D68C87">GENERATION</text><text x="877" y="553" text-anchor="start" font-size="21" font-weight="550" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#F2ECE8">Bounded model context</text><text x="877" y="578" text-anchor="start" font-size="14" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#C3B5B1">Recent conversation + retrieved facts</text><text x="877" y="598" text-anchor="start" font-size="14" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#C3B5B1">Untrusted data kept inside a fence</text><path d="M422 572 L464 572" fill="none" stroke="#AC7778" stroke-width="1.6"  marker-end="url(#arr)"/><path d="M810 572 L853 572" fill="none" stroke="#AC7778" stroke-width="1.6"  marker-end="url(#arr)"/><text x="82" y="704" text-anchor="start" font-size="15" font-weight="450" font-family="'SFMono-Regular',Consolas,monospace" fill="#EAD1C9">Evidence is immutable. Embeddings are rebuildable. Currentness is a projection.</text>
