<text x="70" y="59" text-anchor="start" font-size="12" font-weight="650" font-family="'SFMono-Regular',Consolas,monospace" fill="#B99AEC">CONTINUUM / ARCHITECTURE STUDIES</text>
<text x="70" y="107" text-anchor="start" font-size="40" font-weight="500" font-family="Georgia,'Times New Roman',serif" fill="#F4F0F8">Memory is a lineage, not a transcript.</text>
<text x="70" y="137" text-anchor="start" font-size="15" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#AEA5B8">History, evidence, beliefs, retrieval, and current state remain distinct domains.</text>
<rect x="60" y="172" width="1160" height="242" rx="17" fill="#100F17" stroke="#564465" stroke-width="1.5"/><text x="78" y="198" text-anchor="start" font-size="13" font-weight="650" font-family="'SFMono-Regular',Consolas,monospace" fill="#B99AEC">01 / EVIDENCE → STRUCTURED KNOWLEDGE</text><rect x="80" y="218" width="168" height="143" rx="13" fill="#15141D" stroke="#403849" stroke-width="1.3"/><text x="99" y="244" text-anchor="start" font-size="12" font-weight="600" font-family="'SFMono-Regular',Consolas,monospace" fill="#A98BED">01</text><text x="99" y="272" text-anchor="start" font-size="21" font-weight="550" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#F2EDF6">Message</text><text x="99" y="297" text-anchor="start" font-size="14" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#B8ADBF">Canonical</text><text x="99" y="317" text-anchor="start" font-size="14" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#B8ADBF">owner words</text><path d="M250 287 L272 287" fill="none" stroke="#8F7AA6" stroke-width="1.6"  marker-end="url(#arr)"/><rect x="278" y="218" width="168" height="143" rx="13" fill="#15141D" stroke="#403849" stroke-width="1.3"/><text x="297" y="244" text-anchor="start" font-size="12" font-weight="600" font-family="'SFMono-Regular',Consolas,monospace" fill="#A98BED">02</text><text x="297" y="272" text-anchor="start" font-size="21" font-weight="550" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#F2EDF6">History</text><text x="297" y="297" text-anchor="start" font-size="14" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#B8ADBF">Immutable</text><text x="297" y="317" text-anchor="start" font-size="14" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#B8ADBF">evidence</text><path d="M448 287 L470 287" fill="none" stroke="#8F7AA6" stroke-width="1.6"  marker-end="url(#arr)"/><rect x="476" y="218" width="168" height="143" rx="13" fill="#15141D" stroke="#403849" stroke-width="1.3"/><text x="495" y="244" text-anchor="start" font-size="12" font-weight="600" font-family="'SFMono-Regular',Consolas,monospace" fill="#A98BED">03</text><text x="495" y="272" text-anchor="start" font-size="21" font-weight="550" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#F2EDF6">Extraction</text><text x="495" y="297" text-anchor="start" font-size="14" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#B8ADBF">Model proposes;</text><text x="495" y="317" text-anchor="start" font-size="14" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#B8ADBF">server validates</text><path d="M646 287 L668 287" fill="none" stroke="#8F7AA6" stroke-width="1.6"  marker-end="url(#arr)"/><rect x="674" y="218" width="168" height="143" rx="13" fill="#15141D" stroke="#403849" stroke-width="1.3"/><text x="693" y="244" text-anchor="start" font-size="12" font-weight="600" font-family="'SFMono-Regular',Consolas,monospace" fill="#A98BED">04</text><text x="693" y="272" text-anchor="start" font-size="21" font-weight="550" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#F2EDF6">Memory</text><text x="693" y="297" text-anchor="start" font-size="14" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#B8ADBF">Evidence links</text><text x="693" y="317" text-anchor="start" font-size="14" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#B8ADBF">append-only</text><path d="M844 287 L866 287" fill="none" stroke="#8F7AA6" stroke-width="1.6"  marker-end="url(#arr)"/><rect x="872" y="218" width="168" height="143" rx="13" fill="#15141D" stroke="#403849" stroke-width="1.3"/><text x="891" y="244" text-anchor="start" font-size="12" font-weight="600" font-family="'SFMono-Regular',Consolas,monospace" fill="#A98BED">05</text><text x="891" y="272" text-anchor="start" font-size="21" font-weight="550" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#F2EDF6">Entities</text><text x="891" y="297" text-anchor="start" font-size="14" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#B8ADBF">Identities +</text><text x="891" y="317" text-anchor="start" font-size="14" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#B8ADBF">relationships</text><path d="M1042 287 L1064 287" fill="none" stroke="#8F7AA6" stroke-width="1.6"  marker-end="url(#arr)"/><rect x="1070" y="218" width="168" height="143" rx="13" fill="#15141D" stroke="#403849" stroke-width="1.3"/><text x="1089" y="244" text-anchor="start" font-size="12" font-weight="600" font-family="'SFMono-Regular',Consolas,monospace" fill="#A98BED">06</text><text x="1089" y="272" text-anchor="start" font-size="21" font-weight="550" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#F2EDF6">Vectors</text><text x="1089" y="297" text-anchor="start" font-size="14" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#B8ADBF">Rebuildable</text><text x="1089" y="317" text-anchor="start" font-size="14" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#B8ADBF">pgvector index</text><text x="82" y="390" text-anchor="start" font-size="14" font-weight="500" font-family="'SFMono-Regular',Consolas,monospace" fill="#CAB8DD">A model's proposal is not yet durable knowledge. Every accepted memory cites evidence.</text><rect x="60" y="446" width="1160" height="293" rx="17" fill="#100F17" stroke="#564465" stroke-width="1.5"/><text x="78" y="472" text-anchor="start" font-size="13" font-weight="650" font-family="'SFMono-Regular',Consolas,monospace" fill="#B99AEC">02 / READS OF THE KNOWLEDGE LAYER</text><rect x="80" y="499" width="341" height="145" rx="13" fill="#15141D" stroke="#403849" stroke-width="1.3"/><text x="99" y="525" text-anchor="start" font-size="12" font-weight="600" font-family="'SFMono-Regular',Consolas,monospace" fill="#A98BED">SEARCH</text><text x="99" y="553" text-anchor="start" font-size="21" font-weight="550" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#F2EDF6">Semantic retrieval</text><text x="99" y="578" text-anchor="start" font-size="14" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#B8ADBF">Owner-scoped nearest-neighbor search</text><text x="99" y="598" text-anchor="start" font-size="14" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#B8ADBF">One-hop entity context</text><rect x="469" y="499" width="341" height="145" rx="13" fill="#15141D" stroke="#403849" stroke-width="1.3"/><text x="488" y="525" text-anchor="start" font-size="12" font-weight="600" font-family="'SFMono-Regular',Consolas,monospace" fill="#A98BED">PROJECTION</text><text x="488" y="553" text-anchor="start" font-size="21" font-weight="550" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#F2EDF6">Temporal resolution</text><text x="488" y="578" text-anchor="start" font-size="14" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#B8ADBF">Current · historical · uncertain</text><text x="488" y="598" text-anchor="start" font-size="14" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#B8ADBF">New facts do not erase old history</text><rect x="858" y="499" width="341" height="145" rx="13" fill="#15141D" stroke="#403849" stroke-width="1.3"/><text x="877" y="525" text-anchor="start" font-size="12" font-weight="600" font-family="'SFMono-Regular',Consolas,monospace" fill="#A98BED">GENERATION</text><text x="877" y="553" text-anchor="start" font-size="21" font-weight="550" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#F2EDF6">Bounded model context</text><text x="877" y="578" text-anchor="start" font-size="14" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#B8ADBF">Recent conversation + retrieved facts</text><text x="877" y="598" text-anchor="start" font-size="14" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#B8ADBF">Untrusted data kept inside a fence</text><path d="M422 572 L464 572" fill="none" stroke="#8F7AA6" stroke-width="1.6"  marker-end="url(#arr)"/><path d="M810 572 L853 572" fill="none" stroke="#8F7AA6" stroke-width="1.6"  marker-end="url(#arr)"/><text x="82" y="704" text-anchor="start" font-size="15" font-weight="450" font-family="'SFMono-Regular',Consolas,monospace" fill="#D8C3EF">Evidence is immutable. Embeddings are rebuildable. Currentness is a projection.</text>
