<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 844" width="1280" height="844" role="img" aria-label="Durable execution is a state machine."><title>Durable execution is a state machine.</title><desc>Leases, checkpoints, waits, and fencing survive worker and process failures.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0B0B0C"/><stop offset=".65" stop-color="#100D0E"/><stop offset="1" stop-color="#1C1013"/></linearGradient><pattern id="dot" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#8B6266" opacity=".24"/></pattern><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#D39591" stroke-width="1.4"/></marker></defs><rect width="1280" height="844" fill="url(#bg)"/><rect width="1280" height="844" fill="url(#dot)"/><rect x="46" y="39" width="5" height="41" rx="2" fill="#D98A85"/><text x="67" y="56" font-size="12" fill="#E0A19B" font-weight="600" font-family="'SFMono-Regular',Consolas,monospace" text-anchor="start">CONTINUUM / ARCHITECTURE STUDIES</text><text x="68" y="105" fill="#F4ECE9" font-family="Georgia,'Times New Roman',serif" font-size="39">Durable execution is a state machine.</text><text x="69" y="137" font-size="15" fill="#C4B7B2" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" text-anchor="start">Leases, checkpoints, waits, and fencing survive worker and process failures.</text><rect x="60" y="168" width="1160" height="271" rx="17" fill="#120E10" stroke="#754F56" stroke-width="1.4"/><text x="78" y="195" font-size="13" fill="#D9A19C" font-weight="650" font-family="'SFMono-Regular',Consolas,monospace" text-anchor="start">01 / ONE SEGMENT PER EXECUTION CLAIM</text><rect x="83" y="224" width="178" height="139" rx="11" fill="#191517" stroke="#654A4D" stroke-width="1.2"/><text x="98" y="249" font-size="11" fill="#E0A19B" font-weight="650" font-family="'SFMono-Regular',Consolas,monospace" text-anchor="start">01</text><text x="98" y="278" font-size="20" fill="#F5EDEA" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" text-anchor="start">Durable task</text><text x="98" y="302" font-size="14" fill="#CBBEBA" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" text-anchor="start">Definition stored</text><text x="98" y="321" font-size="14" fill="#CBBEBA" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" text-anchor="start">in PostgreSQL</text><path d="M263 288 L311 288" stroke="#D78A86" stroke-width="1.6" fill="none"  marker-end="url(#arrow)"/><rect x="318" y="224" width="178" height="139" rx="11" fill="#191517" stroke="#654A4D" stroke-width="1.2"/><text x="333" y="249" font-size="11" fill="#E0A19B" font-weight="650" font-family="'SFMono-Regular',Consolas,monospace" text-anchor="start">02</text><text x="333" y="278" font-size="20" fill="#F5EDEA" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" text-anchor="start">Claim + lease</text><text x="333" y="302" font-size="14" fill="#CBBEBA" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" text-anchor="start">One live owner</text><text x="333" y="321" font-size="14" fill="#CBBEBA" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" text-anchor="start">of this attempt</text><path d="M498 288 L546 288" stroke="#D78A86" stroke-width="1.6" fill="none"  marker-end="url(#arrow)"/><rect x="553" y="224" width="178" height="139" rx="11" fill="#191517" stroke="#654A4D" stroke-width="1.2"/><text x="568" y="249" font-size="11" fill="#E0A19B" font-weight="650" font-family="'SFMono-Regular',Consolas,monospace" text-anchor="start">03</text><text x="568" y="278" font-size="20" fill="#F5EDEA" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" text-anchor="start">Worker segment</text><text x="568" y="302" font-size="14" fill="#CBBEBA" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" text-anchor="start">No open SQL tx</text><text x="568" y="321" font-size="14" fill="#CBBEBA" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" text-anchor="start">during inference</text><path d="M733 288 L781 288" stroke="#D78A86" stroke-width="1.6" fill="none"  marker-end="url(#arrow)"/><rect x="788" y="224" width="178" height="139" rx="11" fill="#191517" stroke="#654A4D" stroke-width="1.2"/><text x="803" y="249" font-size="11" fill="#E0A19B" font-weight="650" font-family="'SFMono-Regular',Consolas,monospace" text-anchor="start">04</text><text x="803" y="278" font-size="20" fill="#F5EDEA" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" text-anchor="start">Typed outcome</text><text x="803" y="302" font-size="14" fill="#CBBEBA" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" text-anchor="start">Parse and validate</text><text x="803" y="321" font-size="14" fill="#CBBEBA" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" text-anchor="start">strict protocol</text><path d="M968 288 L1016 288" stroke="#D78A86" stroke-width="1.6" fill="none"  marker-end="url(#arrow)"/><rect x="1023" y="224" width="178" height="139" rx="11" fill="#191517" stroke="#654A4D" stroke-width="1.2"/><text x="1038" y="249" font-size="11" fill="#E0A19B" font-weight="650" font-family="'SFMono-Regular',Consolas,monospace" text-anchor="start">05</text><text x="1038" y="278" font-size="20" fill="#F5EDEA" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" text-anchor="start">Commit outcome</text><text x="1038" y="302" font-size="14" fill="#CBBEBA" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" text-anchor="start">Recheck owner</text><text x="1038" y="321" font-size="14" fill="#CBBEBA" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" text-anchor="start">and fencing</text><text x="82" y="410" font-size="14" fill="#E4B7B0" font-weight="500" font-family="'SFMono-Regular',Consolas,monospace" text-anchor="start">The lease is committed before work begins. A stale worker cannot publish a result.</text><rect x="60" y="471" width="1160" height="204" rx="17" fill="#120E10" stroke="#754F56" stroke-width="1.4"/><text x="78" y="498" font-size="13" fill="#D9A19C" font-weight="650" font-family="'SFMono-Regular',Consolas,monospace" text-anchor="start">02 / THREE VALID OUTCOME PATHS</text><rect x="80" y="524" width="350" height="115" rx="11" fill="#191517" stroke="#654A4D" stroke-width="1.2"/><text x="95" y="549" font-size="11" fill="#E0A19B" font-weight="650" font-family="'SFMono-Regular',Consolas,monospace" text-anchor="start">RESULT</text><text x="95" y="578" font-size="20" fill="#F5EDEA" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" text-anchor="start">Completed</text><text x="95" y="602" font-size="14" fill="#CBBEBA" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" text-anchor="start">One immutable result · terminal</text><rect x="465" y="524" width="350" height="115" rx="11" fill="#191517" stroke="#654A4D" stroke-width="1.2"/><text x="480" y="549" font-size="11" fill="#E0A19B" font-weight="650" font-family="'SFMono-Regular',Consolas,monospace" text-anchor="start">RESUME LATER</text><text x="480" y="578" font-size="20" fill="#F5EDEA" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" text-anchor="start">Checkpointed</text><text x="480" y="602" font-size="14" fill="#CBBEBA" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" text-anchor="start">Continuation saved · pending again</text><rect x="850" y="524" width="350" height="115" rx="11" fill="#191517" stroke="#654A4D" stroke-width="1.2"/><text x="865" y="549" font-size="11" fill="#E0A19B" font-weight="650" font-family="'SFMono-Regular',Consolas,monospace" text-anchor="start">BLOCKED</text><text x="865" y="578" font-size="20" fill="#F5EDEA" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" text-anchor="start">Waiting</text><text x="865" y="602" font-size="14" fill="#CBBEBA" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" text-anchor="start">Checkpoint + blocker · no executor lives</text><rect x="60" y="691" width="1160" height="97" rx="17" fill="#120E10" stroke="#754F56" stroke-width="1.4"/><text x="78" y="718" font-size="13" fill="#D9A19C" font-weight="650" font-family="'SFMono-Regular',Consolas,monospace" text-anchor="start">03 / STALE-LEASE RECOVERY  ·  A SEPARATE OPERATION</text><rect x="103" y="730" rx="8" width="165" height="39" fill="#2C1F23" stroke="#8D6267"/><text x="185" y="755" font-size="13" fill="#E9DFDB" font-weight="550" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" text-anchor="middle">Worker lost</text><path d="M268 749 L335 749" stroke="#D78A86" stroke-width="1.6" fill="none"  marker-end="url(#arrow)"/><rect x="343" y="730" rx="8" width="165" height="39" fill="#2C1F23" stroke="#8D6267"/><text x="425" y="755" font-size="13" fill="#E9DFDB" font-weight="550" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" text-anchor="middle">Lease expires</text><path d="M508 749 L577 749" stroke="#D78A86" stroke-width="1.6" fill="none"  marker-end="url(#arrow)"/><rect x="585" y="730" rx="8" width="165" height="39" fill="#2C1F23" stroke="#8D6267"/><text x="667" y="755" font-size="13" fill="#E9DFDB" font-weight="550" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" text-anchor="middle">Recovery</text><path d="M750 749 L819 749" stroke="#D78A86" stroke-width="1.6" fill="none"  marker-end="url(#arrow)"/><rect x="827" y="730" rx="8" width="165" height="39" fill="#2C1F23" stroke="#8D6267"/><text x="909" y="755" font-size="13" fill="#E9DFDB" font-weight="550" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" text-anchor="middle">Pending task</text><path d="M992 749 L1043 749" stroke="#D78A86" stroke-width="1.6" fill="none"  marker-end="url(#arrow)"/><rect x="1051" y="730" rx="8" width="149" height="39" fill="#2C1F23" stroke="#8D6267"/><text x="1125" y="755" font-size="13" fill="#E9DFDB" font-weight="550" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" text-anchor="middle">Explicit execute</text><line x1="62" y1="797" x2="1219" y2="797" stroke="#5B4345"/><text x="64" y="819" font-size="11" fill="#B69C9B" font-weight="500" font-family="'SFMono-Regular',Consolas,monospace" text-anchor="start">04 / OWNERSHIP · PROVENANCE · RECOVERY</text><text x="1217" y="819" font-size="11" fill="#B69C9B" font-weight="500" font-family="'SFMono-Regular',Consolas,monospace" text-anchor="end">CONTINUUM • TECHNICAL OVERVIEW</text></svg>