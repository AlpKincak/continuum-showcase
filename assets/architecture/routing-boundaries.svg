<rect x="60" y="178" width="1160" height="264" rx="17" fill="#100D0F" stroke="#704E52" stroke-width="1.5"/><text x="78" y="204" text-anchor="start" font-size="13" font-weight="650" font-family="'SFMono-Regular',Consolas,monospace" fill="#E0A09B">ROUTE A / DURABLE EXECUTION TARGET</text><rect x="82" y="231" width="170" height="129" rx="13" fill="#171416" stroke="#4B3C3D" stroke-width="1.3"/><text x="101" y="257" text-anchor="start" font-size="12" font-weight="600" font-family="'SFMono-Regular',Consolas,monospace" fill="#D68C87">01 / GATE</text><text x="101" y="285" text-anchor="start" font-size="21" font-weight="550" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#F2ECE8">Task kind</text><text x="101" y="310" text-anchor="start" font-size="14" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#C3B5B1">Structured</text><text x="101" y="330" text-anchor="start" font-size="14" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#C3B5B1">not inferred</text><path d="M252 294 L267 294" fill="none" stroke="#AC7778" stroke-width="1.6"  marker-end="url(#arr)"/><rect x="272" y="231" width="170" height="129" rx="13" fill="#171416" stroke="#4B3C3D" stroke-width="1.3"/><text x="291" y="257" text-anchor="start" font-size="12" font-weight="600" font-family="'SFMono-Regular',Consolas,monospace" fill="#D68C87">02 / GATE</text><text x="291" y="285" text-anchor="start" font-size="21" font-weight="550" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#F2ECE8">Capabilities</text><text x="291" y="310" text-anchor="start" font-size="14" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#C3B5B1">Subset match</text><text x="291" y="330" text-anchor="start" font-size="14" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#C3B5B1">per target</text><path d="M442 294 L457 294" fill="none" stroke="#AC7778" stroke-width="1.6"  marker-end="url(#arr)"/><rect x="462" y="231" width="170" height="129" rx="13" fill="#171416" stroke="#4B3C3D" stroke-width="1.3"/><text x="481" y="257" text-anchor="start" font-size="12" font-weight="600" font-family="'SFMono-Regular',Consolas,monospace" fill="#D68C87">03 / GATE</text><text x="481" y="285" text-anchor="start" font-size="21" font-weight="550" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#F2ECE8">Cost policy</text><text x="481" y="310" text-anchor="start" font-size="14" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#C3B5B1">Explicit grant</text><text x="481" y="330" text-anchor="start" font-size="14" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#C3B5B1">for metered</text><path d="M632 294 L647 294" fill="none" stroke="#AC7778" stroke-width="1.6"  marker-end="url(#arr)"/><rect x="652" y="231" width="170" height="129" rx="13" fill="#171416" stroke="#4B3C3D" stroke-width="1.3"/><text x="671" y="257" text-anchor="start" font-size="12" font-weight="600" font-family="'SFMono-Regular',Consolas,monospace" fill="#D68C87">04 / GATE</text><text x="671" y="285" text-anchor="start" font-size="21" font-weight="550" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#F2ECE8">Availability</text><text x="671" y="310" text-anchor="start" font-size="14" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#C3B5B1">Probe health</text><text x="671" y="330" text-anchor="start" font-size="14" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#C3B5B1">exclude down</text><path d="M822 294 L837 294" fill="none" stroke="#AC7778" stroke-width="1.6"  marker-end="url(#arr)"/><rect x="842" y="231" width="170" height="129" rx="13" fill="#171416" stroke="#4B3C3D" stroke-width="1.3"/><text x="861" y="257" text-anchor="start" font-size="12" font-weight="600" font-family="'SFMono-Regular',Consolas,monospace" fill="#D68C87">05 / GATE</text><text x="861" y="285" text-anchor="start" font-size="21" font-weight="550" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#F2ECE8">Rank eligible</text><text x="861" y="310" text-anchor="start" font-size="14" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#C3B5B1">Deterministic</text><text x="861" y="330" text-anchor="start" font-size="14" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#C3B5B1">selection</text><path d="M1012 294 L1027 294" fill="none" stroke="#AC7778" stroke-width="1.6"  marker-end="url(#arr)"/><rect x="1032" y="231" width="170" height="129" rx="13" fill="#171416" stroke="#4B3C3D" stroke-width="1.3"/><text x="1051" y="257" text-anchor="start" font-size="12" font-weight="600" font-family="'SFMono-Regular',Consolas,monospace" fill="#D68C87">06 / GATE</text><text x="1051" y="285" text-anchor="start" font-size="21" font-weight="550" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#F2ECE8">Target</text><text x="1051" y="310" text-anchor="start" font-size="14" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#C3B5B1">Persist route</text><text x="1051" y="330" text-anchor="start" font-size="14" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#C3B5B1">before attempt</text><text x="82" y="409" text-anchor="start" font-size="15" font-weight="450" font-family="'SFMono-Regular',Consolas,monospace" fill="#EAD1C9">No model call • no inspection of instructions • no side effects</text><rect x="60" y="472" width="1160" height="289" rx="17" fill="#100D0F" stroke="#704E52" stroke-width="1.5"/><text x="78" y="498" text-anchor="start" font-size="13" font-weight="650" font-family="'SFMono-Regular',Consolas,monospace" fill="#E0A09B">ROUTE B / SINGLE MODEL INFERENCE</text><rect x="82" y="527" width="194" height="135" rx="13" fill="#171416" stroke="#4B3C3D" stroke-width="1.3"/><text x="101" y="562" text-anchor="start" font-size="21" font-weight="550" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#F2ECE8">ModelRequest</text><text x="101" y="589" text-anchor="start" font-size="14" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#C3B5B1">Workload and</text><text x="101" y="609" text-anchor="start" font-size="14" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#C3B5B1">required capabilities</text><path d="M276 596 L314 596" fill="none" stroke="#AC7778" stroke-width="1.6"  marker-end="url(#arr)"/><rect x="319" y="527" width="194" height="135" rx="13" fill="#171416" stroke="#4B3C3D" stroke-width="1.3"/><text x="338" y="562" text-anchor="start" font-size="21" font-weight="550" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#F2ECE8">Routing policy</text><text x="338" y="589" text-anchor="start" font-size="14" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#C3B5B1">Ordered candidates</text><text x="338" y="609" text-anchor="start" font-size="14" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#C3B5B1">by workload</text><path d="M513 596 L551 596" fill="none" stroke="#AC7778" stroke-width="1.6"  marker-end="url(#arr)"/><rect x="556" y="527" width="194" height="135" rx="13" fill="#171416" stroke="#4B3C3D" stroke-width="1.3"/><text x="575" y="562" text-anchor="start" font-size="21" font-weight="550" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#F2ECE8">Registry filter</text><text x="575" y="589" text-anchor="start" font-size="14" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#C3B5B1">Enabled and</text><text x="575" y="609" text-anchor="start" font-size="14" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#C3B5B1">capable providers</text><path d="M750 596 L788 596" fill="none" stroke="#AC7778" stroke-width="1.6"  marker-end="url(#arr)"/><rect x="793" y="527" width="194" height="135" rx="13" fill="#171416" stroke="#4B3C3D" stroke-width="1.3"/><text x="812" y="562" text-anchor="start" font-size="21" font-weight="550" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#F2ECE8">Attempt provider</text><text x="812" y="589" text-anchor="start" font-size="14" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#C3B5B1">Normalized outcome</text><text x="812" y="609" text-anchor="start" font-size="14" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#C3B5B1">or allowed fallback</text><path d="M987 596 L1025 596" fill="none" stroke="#AC7778" stroke-width="1.6"  marker-end="url(#arr)"/><rect x="1030" y="527" width="194" height="135" rx="13" fill="#171416" stroke="#4B3C3D" stroke-width="1.3"/><text x="1049" y="562" text-anchor="start" font-size="21" font-weight="550" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#F2ECE8">ModelResponse</text><text x="1049" y="589" text-anchor="start" font-size="14" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#C3B5B1">One reply</text><text x="1049" y="609" text-anchor="start" font-size="14" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#C3B5B1">or typed failure</text><text x="82" y="717" text-anchor="start" font-size="14" font-weight="400" font-family="'SFMono-Regular',Consolas,monospace" fill="#C3B7B3">Fallback is failure-category dependent. Each candidate is attempted at most once.</text>
