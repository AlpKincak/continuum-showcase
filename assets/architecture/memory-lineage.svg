<text x="70" y="59" text-anchor="start" font-size="12" font-weight="650" font-family="'SFMono-Regular',Consolas,monospace" fill="#E0A09B">CONTINUUM / ARCHITECTURE STUDIES</text>
<text x="70" y="107" text-anchor="start" font-size="40" font-weight="500" font-family="Georgia,'Times New Roman',serif" fill="#F4EFEA">Memory is a lineage, not a transcript.</text>
