<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 840" width="1280" height="840" role="img" aria-label="Coding happens beyond a hard boundary."><title>Coding happens beyond a hard boundary.</title><desc>Workspaces and workers are replaceable; the authority to advance state is not.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0C0C12"/><stop offset=".65" stop-color="#0F0E17"/><stop offset="1" stop-color="#1C142A"/></linearGradient><pattern id="dot" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#6D5B83" opacity=".24"/></pattern><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#B49AE0" stroke-width="1.4"/></marker></defs><rect width="1280" height="840" fill="url(#bg)"/><rect width="1280" height="840" fill="url(#dot)"/><rect x="46" y="39" width="5" height="41" rx="2" fill="#AE89F0"/><text x="67" y="56" font-size="12" fill="#C19DF1" font-weight="600" font-family="'SFMono-Regular',Consolas,monospace" text-anchor="start">CONTINUUM / ARCHITECTURE STUDIES</text><text x="68" y="105" fill="#F4EFF6" font-family="Georgia,'Times New Roman',serif" font-size="39">Coding happens beyond a hard boundary.</text><text x="69" y="137" font-size="15" fill="#B3AABA" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" text-anchor="start">Workspaces and workers are replaceable; the authority to advance state is not.</text><rect x="60" y="173" width="537" height="444" rx="17" fill="#111018" stroke="#5E486E" stroke-width="1.4"/><text x="78" y="200" font-size="13" fill="#BFA4EA" font-weight="650" font-family="'SFMono-Regular',Consolas,monospace" text-anchor="start">CONTROL PLANE  /  CONTINUUM</text><rect x="83" y="221" width="492" height="80" rx="11" fill="#171620" stroke="#51445B" stroke-width="1.2"/><text x="98" y="256" font-size="20" fill="#F5EEF9" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" text-anchor="start">Task identity + owner scope</text><text x="98" y="280" font-size="14" fill="#BDB2C5" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" text-anchor="start">Durable work definition, permissions, lifecycle</text><rect x="83" y="315" width="492" height="80" rx="11" fill="#171620" stroke="#51445B" stroke-width="1.2"/><text x="98" y="350" font-size="20" fill="#F5EEF9" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" text-anchor="start">Route + committed execution grant</text><text x="98" y="374" font-size="14" fill="#BDB2C5" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" text-anchor="start">Target eligibility, policy, and attempt ownership</text><rect x="83" y="409" width="492" height="80" rx="11" fill="#171620" stroke="#51445B" stroke-width="1.2"/><text x="98" y="444" font-size="20" fill="#F5EEF9" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" text-anchor="start">Checkpoints, waits, and immutable results</text><text x="98" y="468" font-size="14" fill="#BDB2C5" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" text-anchor="start">Continuation remains provider-independent</text><rect x="83" y="503" width="492" height="80" rx="11" fill="#171620" stroke="#51445B" stroke-width="1.2"/><text x="98" y="538" font-size="20" fill="#F5EEF9" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" text-anchor="start">Events, receipts, and audit</text><text x="98" y="562" font-size="14" fill="#BDB2C5" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" text-anchor="start">The history of decisions remains inspectable</text><rect x="680" y="173" width="540" height="444" rx="17" fill="#111018" stroke="#5E486E" stroke-width="1.4"/><text x="698" y="200" font-size="13" fill="#BFA4EA" font-weight="650" font-family="'SFMono-Regular',Consolas,monospace" text-anchor="start">EXECUTION PLANE / REPLACEABLE WORKER</text><rect x="703" y="221" width="494" height="80" rx="11" fill="#171620" stroke="#51445B" stroke-width="1.2"/><text x="718" y="256" font-size="20" fill="#F5EEF9" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" text-anchor="start">Private workspace</text><text x="718" y="280" font-size="14" fill="#BDB2C5" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" text-anchor="start">Isolated worktree pinned to the starting revision</text><rect x="703" y="315" width="494" height="80" rx="11" fill="#171620" stroke="#51445B" stroke-width="1.2"/><text x="718" y="350" font-size="20" fill="#F5EEF9" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" text-anchor="start">Coding worker / agent harness</text><text x="718" y="374" font-size="14" fill="#BDB2C5" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" text-anchor="start">Receives bounded segment and workspace grant</text><rect x="703" y="409" width="494" height="80" rx="11" fill="#171620" stroke="#51445B" stroke-width="1.2"/><text x="718" y="444" font-size="20" fill="#F5EEF9" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" text-anchor="start">Structured outcome</text><text x="718" y="468" font-size="14" fill="#BDB2C5" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" text-anchor="start">Proposed result, checkpoint, wait, or failure</text><rect x="703" y="503" width="494" height="80" rx="11" fill="#171620" stroke="#51445B" stroke-width="1.2"/><text x="718" y="538" font-size="20" fill="#F5EEF9" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" text-anchor="start">Validation and read-only inspection</text><text x="718" y="562" font-size="14" fill="#BDB2C5" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" text-anchor="start">Diff / provenance verified before durable commit</text><path d="M577 350 L696 350" stroke="#AE8CE4" stroke-width="1.6" fill="none"  marker-end="url(#arrow)"/><path d="M697 448 L578 448" stroke="#AE8CE4" stroke-width="1.6" fill="none"  marker-end="url(#arrow)"/><text x="637" y="328" font-size="11" fill="#A896BB" font-weight="650" font-family="'SFMono-Regular',Consolas,monospace" text-anchor="middle">VERSIONED</text><text x="637" y="343" font-size="11" fill="#A896BB" font-weight="650" font-family="'SFMono-Regular',Consolas,monospace" text-anchor="middle">BOUNDARY</text><rect x="60" y="646" width="1160" height="139" rx="17" fill="#111018" stroke="#5E486E" stroke-width="1.4"/><text x="78" y="673" font-size="13" fill="#BFA4EA" font-weight="650" font-family="'SFMono-Regular',Consolas,monospace" text-anchor="start">ISOLATION INVARIANTS</text><rect x="80" y="695" width="350" height="53" rx="11" fill="#282036" stroke="#604A74"/><text x="255" y="727" font-size="16" fill="#E4D8F1" font-weight="550" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" text-anchor="middle">No direct canonical-repo edits</text><rect x="466" y="695" width="350" height="53" rx="11" fill="#282036" stroke="#604A74"/><text x="641" y="727" font-size="16" fill="#E4D8F1" font-weight="550" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" text-anchor="middle">No worker-owned task state</text><rect x="852" y="695" width="350" height="53" rx="11" fill="#282036" stroke="#604A74"/><text x="1027" y="727" font-size="16" fill="#E4D8F1" font-weight="550" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" text-anchor="middle">No hidden model-session resume</text><line x1="62" y1="793" x2="1219" y2="793" stroke="#473954"/><text x="64" y="815" font-size="11" fill="#9989AD" font-weight="500" font-family="'SFMono-Regular',Consolas,monospace" text-anchor="start">05 / OWNERSHIP · PROVENANCE · RECOVERY</text><text x="1217" y="815" font-size="11" fill="#9989AD" font-weight="500" font-family="'SFMono-Regular',Consolas,monospace" text-anchor="end">CONTINUUM • TECHNICAL OVERVIEW</text></svg>